variables:
  BIN_PATH: "~/.local/bin"
  NODE_VERSION: "staging"

.develop: &develop_commit
  rules:
    - if: "$CI_COMMIT_BRANCH == 'develop'"

.tag: &tag_commit
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    RELEASE_VERSION: $CI_COMMIT_TAG

.develop_or_tag: &develop_tag_commit
  rules:
    - if: "$CI_COMMIT_BRANCH == 'develop'"
    - if: $CI_COMMIT_TAG
  variables:
    RELEASE_VERSION: v0.1.0

stages:
  - prepare
  - taskfile
  - release-cli
  - build
  - deploy
  - release

prepare:
  <<: *develop_tag_commit
  stage: prepare
  before_script:
    - mkdir -p $BIN_PATH
  script:
    - ls -l /var/run/docker.sock
    - docker --version | grep "Docker version" || (echo "Docker socket not binded."; exit 1)

taskfile:
  <<: *develop_tag_commit
  stage: taskfile
  before_script:
    - apk add --no-cache curl
    - curl --version | grep "curl" || (echo "Curl not installed."; exit 1)
  script:
    - sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b $BIN_PATH
  after_script:
    - $BIN_PATH/task --version | grep "Task version" || (echo "Taskfile not
      installed."; exit 1)
  artifacts:
    paths:
      - $BIN_PATH

release-cli:
  <<: *develop_tag_commit
  stage: release-cli
  before_script:
    - apk add --no-cache curl
    - curl --version | grep "curl" || (echo "Curl not installed."; exit 1)
    - apk add --no-cache sudo
    - sudo --version | grep "Sudo version" || (echo "Sudo not installed."; exit 1)
  script:
    - curl --location --output $BIN_PATH/release-cli
      "https://gitlab.com/api/v4/projects/gitlab-org%2Frelease-cli/packages/generic/release-cli/latest/release-cli-linux-amd64"
    - sudo chmod +x $BIN_PATH/release-cli
  after_script:
    - $BIN_PATH/release-cli -v | grep "release-cli version" || (echo "release-cli
      not installed."; exit 1)
  artifacts:
    paths:
      - $BIN_PATH

build-staging:
  <<: *tag_commit
  stage: build
  script:
    - $BIN_PATH/task docker:build
  dependencies:
    - taskfile

deploy-staging:
  <<: *tag_commit
  stage: deploy
  script:
    - $BIN_PATH/task docker:compose:up
  #  after_script:
  #    - docker system prune -f
  dependencies:
    - taskfile
    - build-staging

release:
  <<: *develop_tag_commit
  stage: release
  script:
    - |
      $BIN_PATH/release-cli create --name "Release $CI_COMMIT_TAG" --description \
      "# Release of image-provider $CI_COMMIT_TAG \n \
       ## Docker images \n - [$CI_COMMIT_TAG](https://hub.docker.com/repository/docker/jav0032/retina/tags)"
    - $BIN_PATH/task docker:push
  dependencies:
    - taskfile
    - release-cli
