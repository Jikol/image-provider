variables:
  TASKFILE_PATH: "~/.local/bin"

.develop: &develop
  only: [develop]

.master: &master
  only: [master]

.git: &git
  before_script:
    - apk add --no-cache git
    - git --version

stages:
  - taskfile
  - build
  - deploy
  - release

taskfile:
  <<: *develop
  stage: taskfile
  before_script:
    - apk add --no-cache curl
    - docker --version
    - ls -l /var/run/docker.sock
  script:
    - sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b $TASKFILE_PATH
  after_script:
    - $TASKFILE_PATH/task --version | grep "Task version" || (echo "Taskfile not installed."; exit 1)
  artifacts:
    paths:
      - $TASKFILE_PATH

build-staging:
  <<: *develop
  stage: build
  script:
    - $TASKFILE_PATH/task docker:build
    - $TASKFILE_PATH/task docker:push
  dependencies:
    - taskfile

deploy-staging:
  <<: *develop
  stage: deploy
  script:
    - $TASKFILE_PATH/task docker:compose:up
#  after_script:
#    - docker system prune -f
  dependencies:
    - taskfile
    - build-staging

release:
  <<: *master
  <<: *git
  stage: release
  script:
    - echo $CI_COMMIT_REF_NAME
    - echo $CI_COMMIT_TAG
    - git log -1 --pretty=%B | grep -q "Merge branch 'develop' into '$CI_COMMIT_REF_NAME'"
    - git describe --tags $(git rev-list --tags --max-count=1)
