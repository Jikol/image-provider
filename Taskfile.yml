version: 3

dotenv: [".env.local"]

env:
  DEFAULT_DOCKER_NAME: local
  DEFAULT_DOCKER_IMAGE: image-provider
  DEFAULT_DOCKER_TAG: latest
  DEFAULT_DOCKER_REGISTRY: ntblppjavorsky:5000

tasks:
  ## development tasks ##
  init:
    desc: >
      Initialize project for development | Usage: task init (i) [-- hard]
    aliases: [i]
    platforms: [linux]
    cmds:
      - cmd: |-
          {{if eq .CLI_ARGS "hard"}}
          rm -rf bun.lock
          {{end}}
          rm -rf node_modules
          bun install

  docker:dev:
    desc: >
      Run docker compose with dev profile for local development | Usage: task docker:dev
      (d:d) [ DOCKER_REGISTRY=<string>, default {{.DEFAULT_DOCKER_REGISTRY}}; ]
    aliases: [d:d]
    platforms: [linux]
    env:
      DOCKER_IMAGE: "{{.DOCKER_IMAGE | default .DEFAULT_DOCKER_IMAGE}}" # pass taskfile variable to environment
      DOCKER_TAG: "{{.DOCKER_TAG | default .DEFAULT_DOCKER_TAG}}" # pass taskfile variable to environment
      DOCKER_REGISTRY: "{{.DOCKER_REGISTRY | default .DEFAULT_DOCKER_REGISTRY}}" # pass taskfile variable to environment
    cmds:
      - defer: docker compose --profile dev down
      - cmd: docker compose --profile dev up --build
  ## ----------------- ##
  ## deployment tasks ##
  docker:build:
    desc: >
      Build docker images for deployment according to compose.yml definition | Usage: task
      docker:build (d:b) [ -- push; DOCKER_TARGET=test/final, default final;
      DOCKER_IMAGE=<string>, default {{.DEFAULT_DOCKER_IMAGE}};
      DOCKER_TAG=<MINOR.MAJOR.PATCH>, default {{.DEFAULT_DOCKER_TAG}}; ]
    summary: |
      Usage: task docker:build (d:b) [
        -- push;
        DOCKER_TARGET=test/final, default final;
        DOCKER_IMAGE=<string>, default {{.DEFAULT_DOCKER_IMAGE}};
        DOCKER_TAG=<MINOR.MAJOR.PATCH>, default {{.DEFAULT_DOCKER_TAG}};
      ]

      Build docker image for deployment

      Optional arguments:
        push            Uploads the image to the registry instead of keep it locally

      Optional variables:
        DOCKER_TARGET   Defines target for docker image stage
        DOCKER_IMAGE    Name of the project image which will be run in container
        DOCKER_TAG      Defines the tag of the resulting image representing the version

      Examples:
        task docker:build
        task docker:build -- push
        task docker:build DOCKER_TARGET=test
        task docker:build DOCKER_IMAGE=custom_user/custom_registry/custom_repository
        task docker:build DOCKER_TAG=1.2.3
    aliases: [d:b]
    platforms: [linux]
    requires:
      vars:
        # SERVER ENVS
        - IMAGE_PROVIDER_PORT
    cmds:
      # prettier-ignore
      - cmd: >-
          docker inspect buildx_buildkit_containerd0 > /dev/null 2>&1 || 
          docker buildx rm containerd 2>/dev/null || true
      - cmd: >-
          docker buildx inspect containerd > /dev/null 2>&1 || 
          docker buildx create --name containerd --driver docker-container --bootstrap
      - cmd: >-
          echo "BuildKit Driver: $(docker buildx inspect --builder containerd | awk -F':
          *' '/^Driver:/ {print $2}')"
      - cmd: >-
          docker build
          --builder containerd
          --provenance false
          --tag {{.DOCKER_IMAGE | default .DEFAULT_DOCKER_IMAGE}}:{{.DOCKER_TAG | default .DEFAULT_DOCKER_TAG}}
          --target {{.DOCKER_TARGET | default "final"}}
          --build-arg IMAGE_PROVIDER_PORT={{.IMAGE_PROVIDER_PORT}}
          {{if and (ne .DOCKER_TARGET "final") (not (or (eq .DOCKER_TARGET nil) (eq .DOCKER_TARGET "")))}}
          --output type=cacheonly
          {{else if eq .CLI_ARGS "push"}}
          --push
          {{else}}
          --load
          {{end}}
          .

  docker:compose:
    desc: >
      Create and start builded docker images containers according to compose.yml
      definition | Usage: task docker:compose (d:c) [ -- [pull] [attach|down];
      DOCKER_NAME=<string>, default {{.DEFAULT_DOCKER_NAME}};
      DOCKER_REGISTRY=<string>, default {{.DEFAULT_DOCKER_REGISTRY}};
      DOCKER_IMAGE=<string>, default {{.DEFAULT_DOCKER_IMAGE}};
      DOCKER_TAG=<MINOR.MAJOR.PATCH>, default {{.DEFAULT_DOCKER_TAG}}; ]
    summary: |
      Usage: task docker:compose (d:c) [
        -- [pull] [attach|down];
        DOCKER_NAME=<string>, default {{.DEFAULT_DOCKER_NAME}};
        DOCKER_REGISTRY=<string>, default {{.DEFAULT_DOCKER_REGISTRY}};
        DOCKER_IMAGE=<string>, default {{.DEFAULT_DOCKER_IMAGE}};
        DOCKER_TAG=<MINOR.MAJOR.PATCH>, default {{.DEFAULT_DOCKER_TAG}};
      ]

      Run builded docker image in container

      Optional arguments:
        pull            Always pull the latest image from the registry before starting
        attach          Attaches logs of all docker containers when they started
        down            Stop and remove running containers and their associated networks

      Optional variables:
        DOCKER_NAME     Compose project name and volume namespace (e.g. staging, production)
        DOCKER_REGISTRY Defines the registry where the image is located
        DOCKER_IMAGE    Name of the project image which will be run in container
        DOCKER_TAG      Defines the tag of the image used to run in the container

      Examples:
        task docker:compose
        task docker:compose -- pull
        task docker:compose -- pull attach
        task docker:compose -- attach
        task docker:compose -- down
        task docker:compose DOCKER_NAME=staging
        task docker:compose DOCKER_REGISTRY=custom-registry:custom-port
        task docker:compose DOCKER_IMAGE=custom_user/custom_registry/custom_repository
        task docker:compose DOCKER_TAG=1.2.3
    aliases: [d:c]
    platforms: [linux]
    env:
      DOCKER_IMAGE: "{{.DOCKER_IMAGE | default .DEFAULT_DOCKER_IMAGE}}" # pass taskfile variable to environment
      DOCKER_NAME: "{{.DOCKER_NAME | default .DEFAULT_DOCKER_NAME}}" # pass taskfile variable to environment
      DOCKER_TAG: "{{.DOCKER_TAG | default .DEFAULT_DOCKER_TAG}}" # pass taskfile variable to environment
      DOCKER_REGISTRY: "{{.DOCKER_REGISTRY | default .DEFAULT_DOCKER_REGISTRY}}" # pass taskfile variable to environment
    cmds:
      # prettier-ignore
      - cmd: docker volume create ${DOCKER_NAME}-image-provider-data || true
      - cmd: |-
          sh -c '
          trap "docker compose --profile prod down --remove-orphans; exit 0" INT
          docker compose --profile prod up -d --no-build \
          {{if contains "pull" .CLI_ARGS}}--pull always{{else}}--pull missing{{end}} \
          --force-recreate --wait
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            docker compose --profile prod logs
            docker compose --profile prod down --remove-orphans
            exit 1
          fi
          docker compose --profile prod logs
          '
        if: '{{and (not (contains "attach" .CLI_ARGS)) (not (contains "down" .CLI_ARGS))}}'
      - cmd: |-
          sh -c '
          trap "docker compose --profile prod down --remove-orphans; exit 0" INT
          docker compose --profile prod up -d --no-build \
          {{if contains "pull" .CLI_ARGS}}--pull always{{else}}--pull missing{{end}} \
          --force-recreate --wait
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            docker compose --profile prod logs
            docker compose --profile prod down --remove-orphans
            exit 1
          fi
          docker compose --profile prod logs -f
          docker compose --profile prod down --remove-orphans
          '
        if: '{{and (contains "attach" .CLI_ARGS) (not (contains "down" .CLI_ARGS))}}'
      - cmd: docker compose --profile prod down --remove-orphans
        if: '{{and (contains "down" .CLI_ARGS) (not (contains "attach" .CLI_ARGS))}}'
      - cmd: |-
          echo "Error: invalid CLI_ARGS '{{.CLI_ARGS}}' — attach and down are mutually exclusive"
          exit 1
        if: '{{and (contains "attach" .CLI_ARGS) (contains "down" .CLI_ARGS)}}'
  ## ---------------- ##
