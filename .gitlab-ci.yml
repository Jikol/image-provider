variables:
  BIN_PATH: '~/.local/bin'
  NODE_VERSION: 'latest'

.develop: &develop_commit
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

.tag: &tag_commit
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

.develop_or_tag: &develop_tag_commit
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

stages:
  - prepare
  - taskfile
  - release-cli
  - build
  - deploy
  - release

prepare:
  stage: prepare
  before_script:
    - mkdir -p $BIN_PATH
  script:
    - ls -l /var/run/docker.sock
    - docker --version | grep "Docker version" || (echo "Docker socket not binded."; exit 1)
  only:
    - develop

taskfile:
  stage: taskfile
  before_script:
    - apk add --no-cache curl
    - curl --version | grep "curl" || (echo "Curl not installed."; exit 1)
  script:
    - sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b $BIN_PATH
  after_script:
    - $BIN_PATH/task --version | grep "Task version" || (echo "Taskfile not
      installed."; exit 1)
  artifacts:
    paths:
      - $BIN_PATH
  only:
    - develop

release-cli:
  stage: release-cli
  before_script:
    - apk add --no-cache curl
    - curl --version | grep "curl" || (echo "Curl not installed."; exit 1)
    - apk add --no-cache sudo
    - sudo --version | grep "Sudo version" || (echo "Sudo not installed."; exit 1)
  script:
    - curl --location --output $BIN_PATH/release-cli
      "https://gitlab.com/api/v4/projects/gitlab-org%2Frelease-cli/packages/generic/release-cli/latest/release-cli-linux-amd64"
    - sudo chmod +x $BIN_PATH/release-cli
  after_script:
    - $BIN_PATH/release-cli -v | grep "release-cli version" || (echo "release-cli
      not installed."; exit 1)
  artifacts:
    paths:
      - $BIN_PATH
  only:
    - develop

build-staging:
  stage: build
  script:
    - $BIN_PATH/task docker:build
    - $BIN_PATH/task docker:push
  dependencies:
    - taskfile
  only:
    - develop

deploy-staging:
  stage: deploy
  script:
    - $BIN_PATH/task docker:compose:up
  #  after_script:
  #    - docker system prune -f
  environment:
    name: staging
    url: http://vsrvfeia0h-86.vsb.cz/
  dependencies:
    - taskfile
    - build-staging
  only:
    - develop

release:
  stage: release
  variables:
    DATETIME_FORMAT: "+%Y-%m-%d %H:%M:%S"
  before_script:
    - apk add --no-cache coreutils
    - PUSH_OUTPUT=$($BIN_PATH/task docker:push RELEASE_VERSION=v0.0.0)
    - IMAGE_NAME=$(echo $PUSH_OUTPUT | grep -o "image-provider[^ ]*" | tr -d ":" | sort -u)
    - DIGEST_NAME=$(echo $PUSH_OUTPUT | grep -o "sha256[^ ]*" | tr ":" "-")
    - DATETIME="$(date -d "$CI_COMMIT_TIMESTAMP" "$DATETIME_FORMAT")"
  script:
    - >-
      $BIN_PATH/release-cli create --tag-name "v0.0.0" --name "v0.0.0"
      --description "
      # 🚀 Release v0.0.0
      
      **Release Date:** $DATETIME 
      
      ### 🐳 Docker images
      
      - [$IMAGE_NAME] (https://hub.docker.com/layers/jav0032/retina/$IMAGE_NAME/images/$DIGEST_NAME)
      "
  dependencies:
    - taskfile
    - release-cli
  only:
    - develop
