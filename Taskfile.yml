version: 3

dotenv: [".env.local"]

env:
  TARGET: "{{if .TARGET}}{{.TARGET}}{{else}}prod{{end}}"
  VERSION: "{{if .VERSION}}{{.VERSION}}{{else}}latest{{end}}"

vars:
  PROFILE: "{{if .PROFILE}}{{.PROFILE}}{{else}}prod{{end}}"
  REPO_NAME: "{{if .REPO_NAME}}{{.REPO_NAME}}{{end}}"
  IMAGE_NAME: "{{if .IMAGE_NAME}}{{.IMAGE_NAME}}{{end}}"

tasks:
  ## development tasks ##
  init:
    desc: Initialize nodejs project for development
    aliases: [i]
    platforms: [linux]
    cmds:
      - '{{if eq .CLI_ARGS "hard"}}rm -rf bun.lockb{{end}}'
      - rm -rf node_modules
      - bun install

  docker:dev:
    desc: Run compose for development with defined variables
    aliases: [d:d]
    platforms: [linux]
    cmds:
      - task: docker:compose
        vars: { PROFILE: dev, CLI_ARGS: up, DEFER: true }
  ## ----------------- ##

  ## deployment tasks ##
  docker:build:
    desc: Build docker image for stage or deployment
    aliases: [d:b]
    platforms: [linux]
    cmds:
      - docker compose --profile {{.PROFILE}} build
      - defer: docker image prune -f

  docker:compose:
    desc: Run compose with defined variables
    aliases: [d:c]
    platforms: [linux]
    vars:
      CLI_ARGS: "{{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}up -d --no-build{{end}}"
      DEFER: "{{if .DEFER}}{{.DEFER}}{{else}}false{{end}}"
    cmds:
      - docker compose --profile {{.PROFILE}} {{.CLI_ARGS}}
      - |
        {{if eq .DEFER "true"}}
        docker compose --profile {{.PROFILE}} down --remove-orphans
        {{end}}

  docker:push:
    desc: Push builded docker image to docker hub
    aliases: [d:p]
    platforms: [linux]
    cmds:
      - echo "{{.DOCKER_PASSWD}}" | docker login -u "{{.DOCKER_USER}}" --password-stdin
      - |
        {{if eq .VERSION "latest"}}
        docker push {{.REPO_NAME}}:{{.IMAGE_NAME}}-latest
        {{else}}
        docker pull {{.REPO_NAME}}:{{.IMAGE_NAME}}-latest
        docker tag {{.REPO_NAME}}:{{.IMAGE_NAME}}-latest {{.REPO_NAME}}:{{.IMAGE_NAME}}-{{.VERSION}}
        docker push {{.REPO_NAME}}:{{.IMAGE_NAME}}-{{.VERSION}}
        docker rmi -f {{.REPO_NAME}}:{{.IMAGE_NAME}}-{{.VERSION}}
        {{end}}
  ## ---------------- ##
