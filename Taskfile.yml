version: 3

dotenv: [".env.local"]

tasks:
  ## development tasks ##
  init:
    desc: >
      Initialize express project for development | 
      Usage: task init (i) [-- hard]
    aliases: [i]
    platforms: [linux]
    cmds:
      - >
        {{if eq .CLI_ARGS "hard"}}
          rm -rf bun.lock
        {{end}}
      - rm -rf node_modules
      - bun install
  ## ----------------- ##

  ## deployment tasks ##
  docker:build:
    desc: >
      Build docker images for deployment according to compose.yml definition | 
      Usage: task docker:build (d:b) [
        DOCKER_TARGET=lint/final, default final;
        DOCKER_IMAGE=<string>, default retina/image-provider;
        DOCKER_TAG=<MINOR.MAJOR.PATCH>, default latest;
      ]
    summary: |
      Usage: task docker:build (d:b) [
        DOCKER_TARGET=lint/final, default final;
        DOCKER_IMAGE=<string>, default retina/image-provider;
        DOCKER_TAG=<MINOR.MAJOR.PATCH>, default latest;
      ]

      Build docker image for deployment

      Optional variables:
        DOCKER_TARGET   Defines target for docker image stage
        DOCKER_IMAGE    Name of the project image which will be run in container
        DOCKER_TAG      Defines the tag of the resulting image representing the version

      Examples:
        task docker:build
        task docker:build DOCKER_TARGET=lint
        task docker:build DOCKER_IMAGE=custom_user/custom_registry/custom_repository
        task docker:build DOCKER_TAG=1.2.3
    aliases: [d:b]
    platforms: [linux]
    env:
      DOCKER_TARGET: "{{.DOCKER_TARGET}}" # pass taskfile variable to environment
      DOCKER_IMAGE: "{{.DOCKER_IMAGE}}" # pass taskfile variable to environment
      DOCKER_TAG: "{{.DOCKER_TAG}}" # pass taskfile variable to environment
      COMPOSE_BAKE: "true"
    cmds:
      - docker compose --profile prod build
      - defer: |
          {{if and (ne .DOCKER_TARGET "final") (not (or (eq .DOCKER_TARGET nil) (eq .DOCKER_TARGET "")))}}
            docker rmi -f retina/image-provider
          {{end}}

  docker:compose:
    desc: >
      Create and start builded docker images containers according to compose.yml definition | 
      Usage: task docker:compose (d:c) [
        -- attach; -- down;
        DOCKER_IMAGE=<string>, default retina/image-provider;
        DOCKER_TAG=<MINOR.MAJOR.PATCH>, default latest;
      ]
    summary: |
      Usage: task docker:compose (d:c) [
        -- attach; -- down;
        DOCKER_IMAGE=<string>, default retina/image-provider;
        DOCKER_TAG=<MINOR.MAJOR.PATCH>, default latest;
      ]

      Run builded docker image in container
      
      Optional arguments:
        attach          Attaches logs of all docker containers when they started
        down            Stop and remove running containers and their associated networks       
      
      Optional variables:
        DOCKER_IMAGE    Name of the project image which will be run in container
        DOCKER_TAG      Defines the tag of the image used to run in the container

      Examples:
        task docker:compose
        task docker:compose -- attach      
        task docker:compose -- down
        task docker:compose DOCKER_IMAGE=custom_user/custom_registry/custom_repository
        task docker:compose DOCKER_TAG=1.2.3
    aliases: [d:c]
    platforms: [linux]
    env:
      DOCKER_IMAGE: "{{.DOCKER_IMAGE}}" # pass taskfile variable to environment
      DOCKER_TAG: "{{.DOCKER_TAG}}" # pass taskfile variable to environment
    cmd: |
      {{if ne .GITLAB_CI "true"}}
        export IMAGE_PROVIDER_UPLOAD_PATH=$(realpath ${IMAGE_PROVIDER_UPLOAD_PATH})
        export IMAGE_PROVIDER_SSL_CERT_PATH=$(realpath ${IMAGE_PROVIDER_SSL_CERT_PATH})
        export IMAGE_PROVIDER_SSL_KEY_PATH=$(realpath ${IMAGE_PROVIDER_SSL_KEY_PATH})
      {{end}}
      {{if eq .CLI_ARGS ""}}
        sh -c 'docker compose --profile prod up -d --no-build --force-recreate --pull missing || (docker compose --profile prod down; exit 1)'
      {{else if eq .CLI_ARGS "attach"}}
        sh -c 'docker compose --profile prod up --no-build --force-recreate --pull missing || (docker compose --profile prod down; exit 1)'
      {{else if eq .CLI_ARGS "down"}}
        docker compose --profile prod down --remove-orphans
      {{else}}
        echo 'Invalid argument: "{{.CLI_ARGS}}". Consult task summary'
      {{end}}
  ## ---------------- ##
