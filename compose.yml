name: ${DOCKER_NAME:?error}

services:
  image-provider:
    image: ${DOCKER_IMAGE:?error}:${DOCKER_TAG:?error}
    profiles: [prod]
    environment:
      # SERVER ENVS
      IMAGE_PROVIDER_DEBUG: ${IMAGE_PROVIDER_DEBUG:?error}
      IMAGE_PROVIDER_PORT: ${IMAGE_PROVIDER_PORT:?error}
      IMAGE_PROVIDER_UPLOAD_PATH: ${IMAGE_PROVIDER_UPLOAD_PATH:?error}
      IMAGE_PROVIDER_UPLOAD_SIZE: ${IMAGE_PROVIDER_UPLOAD_SIZE:?error}
    networks:
      - default
      - proxy
    volumes:
      - data:${IMAGE_PROVIDER_UPLOAD_PATH:?error}
    restart: unless-stopped
    tty: true

networks:
  proxy:
    external: true

volumes:
  data:
    external: true
    name: ${DOCKER_NAME:?error}-image-provider-data
