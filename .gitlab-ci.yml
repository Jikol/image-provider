variables:
  TASKFILE_PATH: "~/.local/bin"

stages:
  - runner_deps
  - build
  - deploy

runner_deps:
  stage: runner_deps
  before_script:
    - apk add --no-cache curl
    - docker --version
    - ls -l /var/run/docker.sock
  script:
    - sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b $TASKFILE_PATH
  after_script:
    - $TASKFILE_PATH/task --version | grep "Task version" || (echo "Taskfile not installed."; exit 1)
  artifacts:
    paths:
      - $TASKFILE_PATH

build-staging:
  stage: build
  script:
    - $TASKFILE_PATH/task docker:build VERSION=$VERSION
  after_script:
    - docker image prune -f
  dependencies:
    - runner_deps

deploy-staging:
  stage: deploy
  script:
    - $TASKFILE_PATH/task docker:compose:up
  dependencies:
    - build-staging
