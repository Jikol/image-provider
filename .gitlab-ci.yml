variables:
  BIN_PATH: "~/.local/bin"
  DOCKER_REGISTRY_HOSTNAME: "public.ecr.aws/k7u6f6n6"
  STAGING_HOSTNAME: "retina-staging.jikol.dev"
  PRODUCTION_HOSTNAME: "retina.jikol.dev"

## pipeline anchors ##
.base: &base
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

.develop_push: &develop_push
  tags: [staging]
  environment:
    name: staging
  interruptible: true
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

.master_tag: &master_tag
  tags: [production]
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
## ---------------- ##

## job anchors ##
.docker_registry_login: &docker_registry_login
  before_script:
    - |
      export AWS_CREDENTIALS=$(docker run --rm \
        -e AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
        -e AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
        amazon/aws-cli:2.25.6 sts assume-role --role-arn "$AWS_ROLE_ARN" \
        --role-session-name "GitlabCIJobSession" \
        --query "Credentials.[AccessKeyId,SecretAccessKey,SessionToken]" \
        --output text)
      export AWS_SESSION_ACCESS_KEY_ID=$(echo $AWS_CREDENTIALS | awk '{print $1}')
      export AWS_SESSION_SECRET_ACCESS_KEY=$(echo $AWS_CREDENTIALS | awk '{print $2}')
      export AWS_SESSION_TOKEN=$(echo $AWS_CREDENTIALS | awk '{print $3}')
    - |
      echo $(docker run --rm \
        -e AWS_ACCESS_KEY_ID="$AWS_SESSION_ACCESS_KEY_ID" \
        -e AWS_SECRET_ACCESS_KEY="$AWS_SESSION_SECRET_ACCESS_KEY" \
        -e AWS_SESSION_TOKEN="$AWS_SESSION_TOKEN" \
        amazon/aws-cli:2.25.6 ecr-public get-login-password --region us-east-1) | \
      docker login -u AWS --password-stdin "$DOCKER_REGISTRY_HOSTNAME"
## ----------- ##

stages:
  - prepare
  - test
  - build
  - deploy
  - release

prepare:
  <<: *base
  stage: prepare
  before_script:
    - ls -l /var/run/docker.sock || (echo "Docker socket not binded."; exit 1)
  script: |
    if [[ "$CI_RUNNER_TAGS" == *"staging"* ]]; then
      docker run --rm \
      -v /etc/letsencrypt:/etc/letsencrypt \
      -v /var/log/letsencrypt:/var/log/letsencrypt \
      --env STAGING_HOSTNAME="$STAGING_HOSTNAME" \
      certbot/certbot certonly --standalone -d "$STAGING_HOSTNAME" --non-interactive --agree-tos -m foo@bar.com
    fi

taskfile:
  <<: *base
  stage: prepare
  before_script:
    - apk add --no-cache curl
    - curl --version || (echo "Curl not installed."; exit 1)
  script:
    - sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b ${BIN_PATH}
  after_script:
    - ${BIN_PATH}/task --version || (echo "Taskfile not installed."; exit 1)
  artifacts:
    paths:
      - ${BIN_PATH}

environments:
  <<: *base
  stage: prepare
  script:
    - echo "CI_DOCKER_TAG=$(echo "$CI_COMMIT_TAG" | awk '{gsub(/^v/, "", $0); print}')" >> variables.env
  artifacts:
    reports:
      dotenv: variables.env

lint-staging:
  <<: *develop_push
  stage: test
  script:
    - ${BIN_PATH}/task docker:build DOCKER_TARGET=lint
  dependencies:
    - taskfile

build-staging:
  <<: *develop_push
  stage: build
  script:
    - ${BIN_PATH}/task docker:build
  dependencies:
    - taskfile

deploy-staging:
  <<: *develop_push
  stage: deploy
  script:
    - ${BIN_PATH}/task docker:compose
  environment:
    name: staging
    url: https://${STAGING_HOSTNAME}:${IMAGE_PROVIDER_PORT}/
  dependencies:
    - taskfile

build-production:
  <<: *master_tag
  <<: *docker_registry_login
  stage: build
  script:
    - |
      ${BIN_PATH}/task docker:build \
        DOCKER_IMAGE="$DOCKER_REGISTRY_HOSTNAME/retina/image-provider" DOCKER_TAG=$CI_DOCKER_TAG
    - |
      docker tag "$DOCKER_REGISTRY_HOSTNAME/retina/image-provider:$CI_DOCKER_TAG" \
        "$DOCKER_REGISTRY_HOSTNAME/retina/image-provider"
    - docker push "$DOCKER_REGISTRY_HOSTNAME/retina/image-provider"
    - docker push "$DOCKER_REGISTRY_HOSTNAME/retina/image-provider:$CI_DOCKER_TAG"
    - docker rmi -f "$DOCKER_REGISTRY_HOSTNAME/retina/image-provider:$CI_DOCKER_TAG"
  dependencies:
    - taskfile
    - environments

deploy-production:
  <<: *master_tag
  stage: deploy
  script:
    - |
      ${BIN_PATH}/task docker:compose \
        DOCKER_IMAGE="$DOCKER_REGISTRY_HOSTNAME/retina/image-provider" DOCKER_TAG=$CI_DOCKER_TAG
    - |
      docker save "$DOCKER_REGISTRY_HOSTNAME/retina/image-provider:$CI_DOCKER_TAG" | \
        gzip > "image_provider_$CI_COMMIT_TAG.tar.gz"
  after_script:
    - echo "CI_DEPLOY_JOB_ID=$CI_JOB_ID" >> variables.env
  environment:
    name: production
    url: https://${PRODUCTION_HOSTNAME}:${IMAGE_PROVIDER_PORT}/
  artifacts:
    paths:
      - "image_provider_$CI_COMMIT_TAG.tar.gz"
    reports:
      dotenv: variables.env
    expire_in: never
  dependencies:
    - taskfile
    - environments

release:
  <<: *master_tag
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:v0.23.0
  variables:
    IMAGE_ARTIFACT: $CI_PROJECT_URL/-/jobs/$CI_DEPLOY_JOB_ID/artifacts/raw/image_provider_$CI_COMMIT_TAG.tar.gz
  script:
    - echo ""
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: |
      ## 🚀 Image Provider $CI_COMMIT_TAG
      
      👤 **Autor**: $GITLAB_USER_NAME ($GITLAB_USER_EMAIL)
      
      📅 **Date**: $CI_COMMIT_TIMESTAMP
      
      🔗 **Pipeline**: $CI_PIPELINE_URL
      
      ⚙️ **Environment**: $CI_ENVIRONMENT_NAME
      
      ### 🐳 Docker
      
      🗄️ **Registry**: [retina/image-provider](https://gallery.ecr.aws/k7u6f6n6/retina/image-provider)
      
      📦 **Image**: [image_provider_$CI_COMMIT_TAG.tar.gz]($IMAGE_ARTIFACT)

      ### 📌 Changelog
      
      $(echo "$CI_COMMIT_TITLE") \
      $(echo "$CI_COMMIT_DESCRIPTION")
    assets:
      links:
        - name: "Docker image (tar.gz)"
          url: "$IMAGE_ARTIFACT"
          filepath: "/docker/image_provider_$CI_COMMIT_TAG.tar.gz"
          link_type: package
  dependencies:
    - deploy-production