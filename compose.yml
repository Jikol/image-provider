name: image-provider

x-redoc-common: &redoc-common
  container_name: redoc
  image: redocly/redoc:v2.1.4
  ports:
    - ${REDOC_PORT}:80
  restart: unless-stopped

services:
  image-provider:
    container_name: image-provider
    image: jav0032/retina:image-provider-${VERSION}
    build:
      target: ${TARGET}
      args:
        VERSION: ${VERSION}
        HOSTNAME: ${HOSTNAME}
        NODE_PORT: ${NODE_PORT}
        REDOC_HOSTNAME: ${REDOC_HOSTNAME}
        REDOC_PORT: ${REDOC_PORT}
    environment:
      VERSION: ${VERSION}
      HOSTNAME: ${HOSTNAME}
      NODE_DEBUG: ${NODE_DEBUG}
      NODE_PORT: ${NODE_PORT}
      NODE_UPLOAD_PATH: ${NODE_UPLOAD_PATH}
      NODE_UPLOAD_SIZE: ${NODE_UPLOAD_SIZE}
      REDOC_HOSTNAME: ${REDOC_HOSTNAME}
      REDOC_PORT: ${REDOC_PORT}
    ports:
      - ${NODE_PORT}:${NODE_PORT}
    restart: unless-stopped
    volumes:
      - ${NODE_UPLOAD_PATH}:${NODE_UPLOAD_PATH}

  redoc-dev:
    <<: *redoc-common
    environment:
      SPEC_URL: "http://localhost:${NODE_PORT}/api/openapi.json"
      PAGE_TITLE: "ReDoc - Image Provider"

  redoc:
    <<: *redoc-common
    environment:
      SPEC_URL: "http://${HOSTNAME}:${NODE_PORT}/api/openapi.json"
      PAGE_TITLE: "ReDoc - Image Provider"
    depends_on:
      image-provider:
        condition: service_started

