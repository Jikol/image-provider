.staging_pipeline: &staging_pipeline
  tags: [staging]
  environment: staging
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

workflow:
  name: $CI_COMMIT_TITLE

default:
  image: docker:28.1.1-cli
  interruptible: true
  artifacts:
    expire_in: 30 minutes

variables:
  CI_BIN_PATH: "~/.local/bin"

stages:
  - test
  - deploy

prepare:
  stage: .pre
  before_script:
    - ls -l /var/run/docker.sock || (echo "Docker socket not binded."; exit 1)
  script:
    - echo "PHONY"

taskfile:
  stage: .pre
  before_script:
    - apk add --no-cache curl
    - curl --version || (echo "Curl not installed."; exit 1)
  script:
    - sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b ${CI_BIN_PATH}
  after_script:
    - ${CI_BIN_PATH}/task --version || (echo "Taskfile not installed."; exit 1)
  artifacts:
    paths:
      - ${CI_BIN_PATH}

environments:
  <<: *staging_pipeline
  stage: .pre
  variables:
    REQUIRED_VARS: "CI_DOCKER_REGISTRY CI_DOCKER_IMAGE CI_STAGING_HOSTNAME"
  before_script:
    - apk add --no-cache jq
    - |-
      for var in $REQUIRED_VARS; do
        eval "val=\$$var"
        [ -z "$val" ] && echo "Required variable '$var' is not set." && exit 1
      done
  script:
    - echo "PHONY"

test-staging:
  <<: *staging_pipeline
  stage: test
  script: |-
    ${CI_BIN_PATH}/task docker:build \
      DOCKER_IMAGE=${CI_DOCKER_IMAGE} \
      DOCKER_TAG=staging \
      DOCKER_TARGET=test
  dependencies:
    - taskfile

deploy-staging:
  <<: *staging_pipeline
  stage: deploy
  script:
    - |-
      ${CI_BIN_PATH}/task docker:build \
        DOCKER_IMAGE=${CI_DOCKER_IMAGE} \
        DOCKER_TAG=staging
    - |-
      ${CI_BIN_PATH}/task docker:compose \
        DOCKER_REGISTRY=${CI_DOCKER_REGISTRY} \
        DOCKER_IMAGE=${CI_DOCKER_IMAGE} \
        DOCKER_TAG=staging
  environment:
    name: staging
    url: https://${CI_STAGING_HOSTNAME}/api/scalar
  dependencies:
    - taskfile
