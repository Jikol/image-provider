version: 3

tasks:
  ## development tasks ##
  init:
    desc: Initialize nodejs project for development
    aliases: [i]
    platforms: [linux]
    cmds:
      - '{{if eq .CLI_ARGS "hard"}}rm -rf bun.lockb{{end}}'
      - rm -rf node_modules
      - bun install
  ## ----------------- ##

  ## deployment tasks ##
  docker:build:
    desc: Build docker image for deployment
    aliases: [d:b]
    platforms: [linux]
    env:
      TARGET: '{{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}prod{{end}}'
    cmds:
      - docker compose build
      - defer: docker image prune -f
      - defer: >
          {{if .CLI_ARGS}}
          docker image rm jav0032/retina:image-provider-{{.VERSION}}
          {{end}}

  docker:compose:
    desc: Run compose for deployment with defined variables
    aliases: [d:c]
    platforms: [linux]
    cmds:
      - docker compose {{.CLI_ARGS}}
      - defer: docker image prune -f
    requires:
      vars: [CLI_ARGS]

  docker:push:
    desc: Push builded docker image to docker hub
    aliases: [d:p]
    platforms: [linux]
    cmds:
      - echo "{{.DOCKER_PASSWD}}" | docker login -u "{{.DOCKER_USER}}" --password-stdin
      - |
        {{if .RELEASE_VERSION}}
        docker pull jav0032/retina:image-provider-{{.VERSION}}
        docker tag jav0032/retina:image-provider-{{.VERSION}} jav0032/retina:image-provider-{{.RELEASE_VERSION}}
        docker push jav0032/retina:image-provider-{{.RELEASE_VERSION}}
        docker rmi -f jav0032/retina:image-provider-{{.RELEASE_VERSION}}
        {{else}}
        docker push jav0032/retina:image-provider-{{.VERSION}}
        {{end}}
  ## ---------------- ##