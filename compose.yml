name: image-provider

services:
  image-provider:
    container_name: image-provider
    image: jav0032/retina:image-provider-${NODE_VERSION}
    restart: unless-stopped
    profiles: [deploy]
    environment:
      NODE_VERSION: ${NODE_VERSION}
      NODE_DEBUG: ${NODE_DEBUG}
      NODE_ENV: ${NODE_ENV}
      NODE_HOSTNAME: ${NODE_HOSTNAME}
      NODE_PORT: ${NODE_PORT}
      NODE_UPLOAD_DIR: ${NODE_UPLOAD_DIR}
      NODE_UPLOAD_SIZE: ${NODE_UPLOAD_SIZE}
      NODE_REDOC_HOSTNAME: ${NODE_REDOC_HOSTNAME}
      NODE_REDOC_PORT: ${NODE_REDOC_PORT}
    ports:
      - ${NODE_PORT}:${NODE_PORT}
    volumes:
      - ${NODE_UPLOAD_DIR}:${NODE_UPLOAD_DIR}

  redoc:
    container_name: redoc
    image: redocly/redoc:v2.1.4
    restart: unless-stopped
    profiles: [deploy, dev]
    environment:
      SPEC_URL: "http://${NODE_HOSTNAME}:${NODE_PORT}/docs"
      PAGE_TITLE: "ReDoc - Image Provider"
    ports:
      - ${NODE_REDOC_PORT}:80
    depends_on:
      image-provider:
        condition: service_healthy
