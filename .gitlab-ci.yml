variables:
  BIN_PATH: "~/.local/bin"
  STAGING_HOSTNAME: "retina-staging.jikol.dev"
  PRODUCTION_HOSTNAME: "retina.jikol.dev"

## pipeline anchors ##
.develop: &develop
  tags: [staging]
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

.master: &master
  tags: [staging]
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

.release: &release
  tags: [production]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
## ---------------- ##

stages:
  - prepare
  - taskfile
  - lint-staging
  - build-staging
  - deploy-staging
  - push-staging

prepare:
  stage: prepare
  script:
    - ls -l /var/run/docker.sock
    - docker --version | grep "Docker version" || (echo "Docker socket not binded."; exit
      1)
    - |
      docker run --rm \
      -v /etc/letsencrypt:/etc/letsencrypt \
      -v /var/log/letsencrypt:/var/log/letsencrypt \
      --env STAGING_HOSTNAME="$STAGING_HOSTNAME" \
      certbot/certbot certonly --standalone -d "$STAGING_HOSTNAME" --non-interactive --agree-tos -m foo@bar.com

taskfile:
  stage: taskfile
  before_script:
    - apk add --no-cache curl
    - curl --version | grep "curl" || (echo "Curl not installed."; exit 1)
  script:
    - sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b ${BIN_PATH}
  after_script:
    - ${BIN_PATH}/task --version | grep "Task version" || (echo "Taskfile not installed.";
      exit 1)
  artifacts:
    paths:
      - ${BIN_PATH}

lint-staging:
  <<: *develop
  stage: lint-staging
  script:
    - ${BIN_PATH}/task docker:build DOCKER_TARGET=lint
  dependencies:
    - taskfile

build-staging:
  <<: *develop
  stage: build-staging
  script:
    - ${BIN_PATH}/task docker:build
  dependencies:
    - taskfile
    - lint-staging

deploy-staging:
  <<: *develop
  stage: deploy-staging
  script:
    - ${BIN_PATH}/task docker:compose
  environment:
    name: staging
    url: http://${STAGING_HOSTNAME}:${IMAGE_PROVIDER_PORT}/
  dependencies:
    - taskfile
    - build-staging

push-staging:
  <<: *master
  stage: push-staging
  before_script:
    - |
      export AWS_CREDENTIALS=$(docker run --rm \
        -e AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
        -e AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
        amazon/aws-cli:latest sts assume-role --role-arn "$AWS_ROLE_ARN" \
        --role-session-name "GitlabCIJobSession" \
        --query "Credentials.[AccessKeyId,SecretAccessKey,SessionToken]" \
        --output text)
      export AWS_SESSION_ACCESS_KEY_ID=$(echo $AWS_CREDENTIALS | awk '{print $1}')
      export AWS_SESSION_SECRET_ACCESS_KEY=$(echo $AWS_CREDENTIALS | awk '{print $2}')
      export AWS_SESSION_TOKEN=$(echo $AWS_CREDENTIALS | awk '{print $3}')
    - |
      echo $(docker run --rm \
        -e AWS_ACCESS_KEY_ID="$AWS_SESSION_ACCESS_KEY_ID" \
        -e AWS_SECRET_ACCESS_KEY="$AWS_SESSION_SECRET_ACCESS_KEY" \
        -e AWS_SESSION_TOKEN="$AWS_SESSION_TOKEN" \
        amazon/aws-cli:latest ecr-public get-login-password --region us-east-1) | \
      docker login -u AWS --password-stdin public.ecr.aws/k7u6f6n6
  script:
    - docker tag retina/image-provider:latest public.ecr.aws/k7u6f6n6/retina/image-provider:latest
    - docker push public.ecr.aws/k7u6f6n6/retina/image-provider:latest
  after_script:
    - docker rmi -f public.ecr.aws/k7u6f6n6/retina/image-provider:latest