variables:
  TASKFILE_PATH: "~/.local/bin"
  NODE_VERSION: "staging"

.develop: &develop
  only: [develop]

.master: &master
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    RELEASE_VERSION: $CI_COMMIT_TAG

stages:
  - taskfile
  - build
  - deploy
  - release

taskfile:
  stage: taskfile
  before_script:
    - apk add --no-cache curl
    - docker --version
    - ls -l /var/run/docker.sock
    - mkdir -p $TASKFILE_PATH
  script:
    - sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b $TASKFILE_PATH
  after_script:
    - $TASKFILE_PATH/task --version | grep "Task version" || (echo "Taskfile not installed."; exit 1)
  artifacts:
    paths:
      - $TASKFILE_PATH

build-staging:
  <<: *develop
  stage: build
  script:
    - $TASKFILE_PATH/task docker:build
  dependencies:
    - taskfile

deploy-staging:
  <<: *develop
  stage: deploy
  script:
    - $TASKFILE_PATH/task docker:compose:up
#  after_script:
#    - docker system prune -f
  dependencies:
    - taskfile
    - build-staging

release:
  <<: *master
  stage: release
  services:
    - registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - docker -v
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: "Release of image-provider $CI_COMMIT_TAG"
  dependencies:
    - taskfile
