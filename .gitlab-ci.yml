variables:
  TASKFILE_PATH: "~/.local/bin"
  VERSION_PATH: "version.env"

.develop: &develop
  only: [develop]

.master: &master
  only: [master]

.git: &git
  before_script:
    - apk add --no-cache git
    - git --version

stages:
  - prepare
  - taskfile
  - build
  - deploy
  - release

prepare:
  <<: *git
  stage: prepare
  script:
    - echo "NODE_VERSION=$(git describe --tags $(git rev-list --tags --max-count=1))" > $VERSION_PATH
    - cat version.env
  artifacts:
    paths:
      - $VERSION_PATH

taskfile:
  <<: *develop
  stage: taskfile
  before_script:
    - apk add --no-cache curl
    - docker --version
    - ls -l /var/run/docker.sock
    - source $VERSION_PATH
    - echo $NODE_VERSION
  script:
    - sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b $TASKFILE_PATH
  after_script:
    - $TASKFILE_PATH/task --version | grep "Task version" || (echo "Taskfile not installed."; exit 1)
  artifacts:
    paths:
      - $TASKFILE_PATH
  dependencies:
    - prepare

build-staging:
  <<: *develop
  stage: build
  script:
    - echo $NODE_VERSION
    - $TASKFILE_PATH/task docker:build
    - $TASKFILE_PATH/task docker:push
  dependencies:
    - taskfile

deploy-staging:
  <<: *develop
  stage: deploy
  script:
    - $TASKFILE_PATH/task docker:compose:up
#  after_script:
#    - docker system prune -f
  dependencies:
    - taskfile
    - build-staging

release:
  <<: *master
  stage: release
  script:
    - echo test
