variables:
  BIN_PATH: "~/.local/bin"
  DOCKER_REGISTRY_HOSTNAME: "public.ecr.aws/k7u6f6n6"
  STAGING_HOSTNAME: "retina-staging.jikol.dev"
  PRODUCTION_HOSTNAME: "retina.jikol.dev"

## pipeline anchors ##
.base: &base
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

.develop_push: &develop_push
  tags: [staging]
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

.master_tag: &master_tag
  tags: [production]
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
## ---------------- ##

stages:
  - prepare
  - taskfile
  - lint
  - build
  - deploy
  - release

prepare:
  <<: *base
  stage: prepare
  before_script:
    - ls -l /var/run/docker.sock || (echo "Docker socket not binded."; exit 1)
  script:
    - |
      if [[ "$CI_RUNNER_TAGS" == *"staging"* ]]; then
        docker run --rm \
        -v /etc/letsencrypt:/etc/letsencrypt \
        -v /var/log/letsencrypt:/var/log/letsencrypt \
        --env STAGING_HOSTNAME="$STAGING_HOSTNAME" \
        certbot/certbot certonly --standalone -d "$STAGING_HOSTNAME" --non-interactive --agree-tos -m foo@bar.com
      fi

taskfile:
  <<: *base
  stage: taskfile
  before_script:
    - apk add --no-cache curl
    - curl --version || (echo "Curl not installed."; exit 1)
  script:
    - sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b ${BIN_PATH}
  after_script:
    - ${BIN_PATH}/task --version || (echo "Taskfile not installed."; exit 1)
  artifacts:
    paths:
      - ${BIN_PATH}

lint-staging:
  <<: *develop_push
  stage: lint
  script:
    - ${BIN_PATH}/task docker:build DOCKER_TARGET=lint
  dependencies:
    - taskfile

build-staging:
  <<: *develop_push
  stage: build
  script:
    - ${BIN_PATH}/task docker:build
  dependencies:
    - taskfile
    - lint-staging

deploy-staging:
  <<: *develop_push
  stage: deploy
  script:
    - ${BIN_PATH}/task docker:compose
  environment:
    name: staging
    url: https://${STAGING_HOSTNAME}:${IMAGE_PROVIDER_PORT}/
  dependencies:
    - taskfile
    - build-staging

build-production:
  <<: *master_tag
  stage: build
  script:
    - ${BIN_PATH}/task docker:build DOCKER_TAG=$CI_COMMIT_TAG
  dependencies:
    - taskfile

deploy-production:
  <<: *master_tag
  stage: deploy
  script:
    - ${BIN_PATH}/task docker:compose DOCKER_TAG=$CI_COMMIT_TAG
  environment:
    name: production
    url: https://${PRODUCTION_HOSTNAME}:${IMAGE_PROVIDER_PORT}/
  dependencies:
    - taskfile
    - build-production

release:
  <<: *master_tag
  stage: release
  before_script:
    - |
      export AWS_CREDENTIALS=$(docker run --rm \
        -e AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
        -e AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
        amazon/aws-cli:2.25.6 sts assume-role --role-arn "$AWS_ROLE_ARN" \
        --role-session-name "GitlabCIJobSession" \
        --query "Credentials.[AccessKeyId,SecretAccessKey,SessionToken]" \
        --output text)
      export AWS_SESSION_ACCESS_KEY_ID=$(echo $AWS_CREDENTIALS | awk '{print $1}')
      export AWS_SESSION_SECRET_ACCESS_KEY=$(echo $AWS_CREDENTIALS | awk '{print $2}')
      export AWS_SESSION_TOKEN=$(echo $AWS_CREDENTIALS | awk '{print $3}')
    - |
      echo $(docker run --rm \
        -e AWS_ACCESS_KEY_ID="$AWS_SESSION_ACCESS_KEY_ID" \
        -e AWS_SECRET_ACCESS_KEY="$AWS_SESSION_SECRET_ACCESS_KEY" \
        -e AWS_SESSION_TOKEN="$AWS_SESSION_TOKEN" \
        amazon/aws-cli:2.25.6 ecr-public get-login-password --region us-east-1) | \
      docker login -u AWS --password-stdin public.ecr.aws/k7u6f6n6
  script:
    - echo "Release"
  dependencies:
    - deploy-production