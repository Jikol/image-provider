name: image-provider

services:
  image-provider:
    container_name: image-provider
    image: jav0032/retina:image-provider-${VERSION}
    build:
      target: ${TARGET}
      args:
        NODE_PORT: ${NODE_PORT}
        NODE_HOSTNAME: ${NODE_HOSTNAME}
        VERSION: ${VERSION}
        REDOC_HOSTNAME: ${REDOC_HOSTNAME}
        REDOC_PORT: ${REDOC_PORT}
    environment:
      NODE_DEBUG: ${NODE_DEBUG}
      NODE_HOSTNAME: ${NODE_HOSTNAME}
      NODE_PORT: ${NODE_PORT}
      NODE_UPLOAD_PATH: ${NODE_UPLOAD_PATH}
      NODE_UPLOAD_SIZE: ${NODE_UPLOAD_SIZE}
      VERSION: ${VERSION}
      REDOC_HOSTNAME: ${REDOC_HOSTNAME}
      REDOC_PORT: ${REDOC_PORT}
    ports:
      - ${NODE_PORT}:${NODE_PORT}
    restart: unless-stopped
    volumes:
      - ${NODE_UPLOAD_PATH}:${NODE_UPLOAD_PATH}

  redoc:
    container_name: redoc
    image: redocly/redoc:v2.1.4
    environment:
      SPEC_URL: "http://${NODE_HOSTNAME}:${NODE_PORT}/api/openapi.json"
      PAGE_TITLE: "ReDoc - Image Provider"
    ports:
      - ${REDOC_PORT}:80
    restart: unless-stopped
    depends_on:
      image-provider:
        condition: service_healthy
