version: '3'

dotenv: ['.env']

vars:
  SHELL_START: '{{if eq .OS "Windows_NT"}}wsl bash -c "{{end}}'
  SHELL_END: '{{if eq .OS "Windows_NT"}}"{{end}}'
  DATETIME: '{{now | date "2006-01-02 15:04:05"}}'
  VERSION: 'staging'

tasks:
  ## development tasks ##
  init:
    desc: Initialize parcel project for development
    aliases: [i]
    cmds:
      - corepack enable
      - yarn install

  init:reinstall:
    desc: Reinitialize parcel project for development (delete cache & node_modules)
    aliases: [i:r]
    cmds:
      - task: clear
      - task: init

  init:reinit:
    desc: Reinitialize parcel project for development (delete all)
    aliases: [i:re]
    cmds:
      - task: prune
      - task: init

  clear:
    desc: Clear node_modules of all yarn workspaces installs
    aliases: [c]
    internal: true
    cmds:
      - "{{.SHELL_START}}rm -rf .yarn{{.SHELL_END}}"
      - "{{.SHELL_START}}rm -rf node_modules{{.SHELL_END}}"

  prune:
    desc: Prune node_modules of yarn installs with lock file
    aliases: [p]
    internal: true
    cmds:
      - "{{.SHELL_START}}rm -rf .yarn{{.SHELL_END}}"
      - "{{.SHELL_START}}rm -rf yarn.lock{{.SHELL_END}}"
      - "{{.SHELL_START}}rm -rf node_modules{{.SHELL_END}}"

  dev:compose:up:
    desc: Run compose for dependent service for development
    aliases: [d:c:u]
    cmd: "{{.SHELL_START}}docker compose --profile dev up -d{{.SHELL_END}}"

  dev:compose:down:
    desc: Stop compose for dependent service for development
    aliases: [d:c:d]
    cmd: "{{.SHELL_START}}docker compose --profile dev down {{.CLI_ARGS}}{{.SHELL_END}}"
  ## ----------------- ##

  ## deployment tasks ##
  docker:build:
    desc: Build docker image for deployment
    aliases: [d:b]
    cmds:
      - >
        docker build
        --build-arg DATETIME='{{.DATETIME}}'
        --build-arg DATETIME='{{.VERSION}}'
        --build-arg NODE_DEBUG='{{.NODE_DEBUG}}'
        --build-arg NODE_ENV='{{.NODE_ENV}}'
        --build-arg NODE_HOSTNAME='{{.NODE_HOSTNAME}}'
        --build-arg NODE_PORT='{{.NODE_PORT}}'
        --build-arg NODE_UPLOAD_DIR='{{.NODE_UPLOAD_DIR}}'
        --build-arg NODE_UPLOAD_SIZE='{{.NODE_UPLOAD_SIZE}}'
        --build-arg NODE_REDOC_HOSTNAME='{{.NODE_REDOC_HOSTNAME}}'
        --build-arg NODE_REDOC_PORT='{{.NODE_REDOC_PORT}}'
        -t jav0032/retina:image-provider-{{.VERSION}}
        -f Dockerfile .
      - docker image prune -f

  docker:push:
    desc: Push builded docker image to docker hub
    aliases: [d:p]
    cmds:
      - echo "{{.DOCKER_PASSWD}}" | docker login -u "{{.DOCKER_USER}}" --password-stdin
      - |
        {{if .RELEASE_VERSION}}
        docker tag jav0032/retina:image-provider-{{.VERSION}} jav0032/retina:image-provider-{{.RELEASE_VERSION}}
        docker push jav0032/retina:image-provider-{{.RELEASE_VERSION}}
        docker rmi -f jav0032/retina:image-provider-{{.RELEASE_VERSION}}
        {{else}}
        docker push jav0032/retina:image-provider-{{.VERSION}}
        {{end}}

  docker:compose:up:
    desc: Run compose for builded images
    aliases: [d:c]
    cmds:
      - "{{.SHELL_START}}docker compose --profile deploy up -d{{.SHELL_END}}"

  docker:compose:down:
    desc: Down compose for builded images
    aliases: [d:c]
    cmds:
      - "{{.SHELL_START}}docker compose --profile deploy down{{.SHELL_END}}"
  ## ---------------- ##