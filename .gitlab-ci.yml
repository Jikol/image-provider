variables:
  TASKFILE_PATH: "~/.local/bin"

.develop: &develop
  only: [develop]

.master: &master
  only: [master]

.git: &git
  before_script:
    - apk add --no-cache git
    - git --version

stages:
  - taskfile
  - prepare
  - build
  - deploy
  - release

taskfile:
  <<: *develop
  stage: taskfile
  before_script:
    - apk add --no-cache curl
    - docker --version
    - ls -l /var/run/docker.sock
  script:
    - sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b $TASKFILE_PATH
  after_script:
    - $TASKFILE_PATH/task --version | grep "Task version" || (echo "Taskfile not installed."; exit 1)
  artifacts:
    paths:
      - $TASKFILE_PATH

prepare:
  <<: *git
  stage: prepare
  script:
    - echo "NODE_VERSION=$(git describe --tags $(git rev-list --tags --max-count=1))" > version.env
    - cat version.env
  artifacts:
    paths:
      - version.env

build-staging:
  <<: *develop
  stage: build
  before_script:
    - source version.env
    - echo $NODE_VERSION
  script:
    - echo $NODE_VERSION
    - echo $CI_COMMIT_TAG
    - $TASKFILE_PATH/task docker:build
    - $TASKFILE_PATH/task docker:push
  dependencies:
    - taskfile
    - prepare

deploy-staging:
  <<: *develop
  stage: deploy
  script:
    - $TASKFILE_PATH/task docker:compose:up
#  after_script:
#    - docker system prune -f
  dependencies:
    - taskfile
    - build-staging

release:
  <<: *master
  <<: *git
  stage: release
  script:
    - TAG=$(git describe --tags $(git rev-list --tags --max-count=1))
    - if [ "$CI_COMMIT_REF_NAME" == "master" ] && git log -1 --pretty=%B | grep -q "Merge branch 'develop' into '$CI_COMMIT_REF_NAME'"; then
      
      else
        echo "Spatne"
      fi
